name: Build and Deploy Staging

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      profile:
        description: Build configuration
        type: choice
        options: [staging, production]
        default: staging
      publication_date:
        description: Frozen Europe/Paris publication date (YYYY-MM-DD)
        type: string
      candidate_id:
        description: Reserved production candidate ID
        type: string
      browser_observability:
        description: Enable consent-gated browser observability
        type: boolean
        default: false
      product_analytics:
        description: Enable consent-gated product analytics
        type: boolean
        default: false

concurrency:
  group: staging-build-it-art-studio-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/amineamanzou/it-art-studio

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.4
          cache: npm
      - run: node --test tests/*.test.mjs
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - run: npm run build
      - run: npm run review:site
  release:
    name: release
    if: github.repository == 'amineamanzou/ItArtStudio' && ((github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || (github.event_name == 'workflow_dispatch' && inputs.profile == 'production' && github.ref == format('refs/heads/release/factory-promotion/{0}', inputs.candidate_id)))
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.4
      - name: Freeze build configuration and publication date
        env:
          INPUT_PROFILE: ${{ inputs.profile }}
          INPUT_PUBLICATION_DATE: ${{ inputs.publication_date }}
          INPUT_CANDIDATE_ID: ${{ inputs.candidate_id }}
          INPUT_BROWSER_OBSERVABILITY: ${{ inputs.browser_observability }}
          INPUT_PRODUCT_ANALYTICS: ${{ inputs.product_analytics }}
          PUBLIC_BROWSER_OBSERVABILITY_URL: ${{ vars.PUBLIC_BROWSER_OBSERVABILITY_URL }}
          PUBLIC_POSTHOG_KEY: ${{ vars.PUBLIC_POSTHOG_KEY }}
        run: |
          node scripts/qa/release-candidate.mjs prepare
          echo "TREE_SHA=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker image metadata
        id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: type=raw,value=staging-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.title=IT Art Studio
            org.opencontainers.image.description=Static Astro showcase for itart.studio
            org.opencontainers.image.url=https://itart.studio
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.PRODUCT_VERSION }}

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push SHA-tagged release candidate
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # Query current advisories in the Node build stage on every image build.
          no-cache-filters: build
          context: .
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          provenance: mode=min,version=v1
          sbom: true
          build-args: |
            SITE_URL=https://itart.studio
            BASE_PATH=/
            VCS_REF=${{ github.sha }}
            TREE_SHA=${{ env.TREE_SHA }}
            BUILD_RUN_ID=${{ github.run_id }}
            BUILD_ATTEMPT=${{ github.run_attempt }}
            PUBLICATION_DATE=${{ env.PUBLICATION_DATE }}
            RELEASE_VARIANT=${{ env.RELEASE_VARIANT }}
            RELEASE_CONFIGURATION=${{ env.RELEASE_CONFIGURATION }}

      - name: Gate the exact pushed digest on critical vulnerabilities
        id: trivy_pushed_digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: table
          severity: CRITICAL
          vuln-type: os,library
          exit-code: "1"

      - name: Scan the exact pushed digest for code scanning
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: MEDIUM,HIGH,CRITICAL
          vuln-type: os,library
          exit-code: "0"

      - name: Upload Trivy SARIF to code scanning
        uses: github/codeql-action/upload-sarif@776237d428f23fefc3d9e0fe1962921cbcd53e17 # codeql-bundle-v2.27.5 update
        with:
          sarif_file: trivy-results.sarif

      - name: Upload Trivy SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: error

      - name: Generate SBOM from the exact pushed digest
        id: image_sbom
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: cyclonedx
          output: image-sbom.cdx.json
          vuln-type: os,library

      - name: Upload image SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sbom-cyclonedx
          path: image-sbom.cdx.json
          if-no-files-found: error

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign pushed digest
        id: cosign_sign
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
        run: |
          test -n "${{ steps.push.outputs.digest }}"
          cosign sign --yes "$IMAGE_REF"

      - name: Verify pushed digest signature
        id: cosign_verify
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
        run: |
          cosign verify "$IMAGE_REF" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity="https://github.com/${{ github.repository }}/.github/workflows/build-staging.yml@${{ github.ref }}"

      - name: Attest image provenance
        id: attest_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest image SBOM
        id: attest_sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: image-sbom.cdx.json
          push-to-registry: true

      - name: Verify image provenance attestation
        id: verify_attestation
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
        run: |
          gh attestation verify "oci://${IMAGE_REF}" \
            --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/build-staging.yml" \
            --source-ref "${{ github.ref }}" \
            --source-digest "${{ github.sha }}" \
            --predicate-type "https://slsa.dev/provenance/v1"

      - name: Extract exact image release metadata
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
        run: |
          docker pull "$IMAGE_REF"
          container=$(docker create "$IMAGE_REF")
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/srv/.well-known/release.json" release-metadata.json

      - name: Emit verified staging event
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          RELEASE_METADATA_PATH: release-metadata.json
        run: node scripts/qa/staging-event.mjs > cicd-event-staging.json

      - name: Upload verified staging event
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cicd-event-staging
          overwrite: true
          path: cicd-event-staging.json
          if-no-files-found: error
