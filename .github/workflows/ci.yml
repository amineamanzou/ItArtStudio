name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  site:
    name: Astro site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type and Astro check
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Build GitHub Pages path
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          SITE_URL: https://amineamanzou.github.io
          BASE_PATH: /ItArtStudio

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: it-art-studio-dist
          path: dist
          if-no-files-found: error

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    needs: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t it-art-studio:ci .

      - name: Run container
        run: docker run --rm -d --name it-art-studio-ci -p 8080:8080 it-art-studio:ci

      - name: Smoke test home
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsSI http://127.0.0.1:8080/ | tee headers.txt; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/ | grep -q "IT Art Studio"
          grep -qi "x-content-type-options: nosniff" headers.txt

      - name: Show container logs on failure
        if: failure()
        run: docker logs it-art-studio-ci

      - name: Stop container
        if: always()
        run: docker stop it-art-studio-ci || true
