name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Astro check
        run: npm run check

      - name: Build for GitHub Pages
        run: npm run build:pages

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        timeout-minutes: 4

      - name: Smoke static Pages artifact
        run: npm run qa:game:static
        timeout-minutes: 6
        env:
          QA_PORT: "4333"
          QA_BASE_URL: "http://127.0.0.1:4333/ItArtStudio/?qa=1"
          QA_STATIC_PROOF_SCOPE: "smoke"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
